<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>To-Do List</h1>
    </header>

    <section class="inputSection">
        <h2 id="infoInput">Fyll i info</h2>
        <input id="title" class="inputBox" type="text" placeholder="Titel på uppgift, ex: Tvätta bilen">
        <input id="description" class="inputBox" type="text" placeholder="Beskrivning av uppgiften">

        <div class="dropdownContainer">
            <label id="prioritySelectorLabel" for="priority">Är uppgiften viktig?:</label>
            <select id="priority">
                <option value="ja">Ja</option>
                <option value="nej">Nej</option>
            </select>
        </div>

        <button>Lägg till uppgift!</button>
    </section>

    <section class="taskList">
        <h2 id="taskListTitle">Uppgift lista</h2>
        <div class="listContainer">
            <div id="tasksToDo">
                <h3 class="taskStatusTitle">Att göra</h3>
                <ul id="unCompletedTasks">
                    <p id="unCompleted-placeholder">Inga uppgifter än...</p>
                </ul>
            </div>
            <div id="doneTasks">
                <h3 class="taskStatusTitle">Klara</h3>
                <ul id="completedTasks">
                    <p id="completed-placeholder">Inga klara uppgifter än...</p>
                </ul>
            </div>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
